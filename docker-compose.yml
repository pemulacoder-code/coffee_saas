services:
  postgres:
    image: postgres:17
    container_name: coffee_saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffee_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: coffee_saas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: coffee_saas_api
    restart: unless-stopped
    environment:
      APP_NAME: Coffee SaaS
      APP_ENV: development
      DEBUG: "true"
      LOG_LEVEL: INFO

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/coffee_saas

      REDIS_URL: redis://redis:6379/0

      JWT_SECRET_KEY: change-this-in-development
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30

      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: